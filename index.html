<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POINT ZERO 2.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg: #030305;
            --surface: #0f111a;
            --accent: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.5);
            --gold: #ffcc00;
            --blue: #00d4ff;
            --green: #00ff88;
            --text: #e0e0e5;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 85, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 212, 255, 0.05) 0%, transparent 40%);
        }

        /* --- UI HEADER --- */
        #ui-top {
            position: sticky; top: 0; width: 100%; max-width: 500px;
            padding: 20px; z-index: 1000; box-sizing: border-box;
            background: linear-gradient(to bottom, var(--bg) 60%, transparent);
        }

        .status-container {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .hp-section { flex: 1; }
        .hp-bar-bg { height: 6px; background: #222; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        #hp-bar-fill { height: 100%; background: var(--accent); width: 100%; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 10px var(--accent); }
        .hp-text { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--accent); }

        .boss-section { text-align: center; margin: 0 15px; }
        #boss-circle { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: var(--gold); border: 2px solid var(--gold); width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }

        /* --- JOKER GRID --- */
        .joker-row { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .joker-box {
            background: #1a1c26; border: 1px solid #333; border-radius: 12px;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; cursor: pointer; transition: 0.3s;
        }
        .joker-box.active { border-color: var(--blue); box-shadow: 0 0 15px var(--blue); transform: translateY(-3px); background: rgba(0, 212, 255, 0.1); }
        .joker-box.used { opacity: 0.1; filter: grayscale(1); pointer-events: none; }

        /* --- GAME GRID --- */
        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; width: 90%; max-width: 500px; padding-bottom: 120px;
        }

        .card {
            background: var(--surface); border-radius: 16px; padding: 25px 15px;
            position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s; text-align: center;
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--blue); }
        .card:active { transform: scale(0.95); background: #1c1f2b; }
        .card.used { opacity: 0.2; transform: scale(0.9); pointer-events: none; }
        .card-cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #888; display: block; margin-bottom: 5px; }
        .card-name { font-size: 1.1rem; font-weight: 700; color: #fff; }

        /* --- MODALS 2.0 --- */
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-2 {
            background: var(--surface); width: 85%; max-width: 400px;
            padding: 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,1);
        }
        #m-q { font-size: 1.4rem; font-weight: 500; line-height: 1.4; margin: 20px 0; min-height: 80px; }
        
        input[type="number"] {
            background: #000; border: 2px solid #333; color: var(--blue);
            width: 140px; padding: 15px; border-radius: 15px;
            font-family: 'Orbitron', sans-serif; font-size: 2rem; outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        .btn-confirm {
            background: var(--accent); color: #fff; border: none;
            width: 100%; padding: 18px; border-radius: 15px;
            font-weight: 700; font-size: 1.1rem; margin-top: 25px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- FOOTER NAV --- */
        footer {
            position: fixed; bottom: 20px; width: 90%; max-width: 400px;
            display: flex; gap: 10px; z-index: 1000;
        }
        .btn-nav {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 12px; border-radius: 12px; color: #666; font-size: 0.8rem; cursor: pointer;
            backdrop-filter: blur(10px);
        }

        @keyframes damage { 0% { transform: translate(2px, 1px) rotate(0deg); } 20% { transform: translate(-3px, -1px) rotate(-1deg); } 100% { transform: translate(0,0); } }
        .dmg-shake { animation: damage 0.1s linear infinite; animation-iteration-count: 4; }
    </style>
</head>
<body id="main">

    <div id="ui-top">
        <div class="status-container">
            <div class="hp-section">
                <div class="stat-label" style="font-size: 0.7rem; color: #666;">SYSTEM STABILITY</div>
                <div class="hp-text"><span id="hp-val">100</span>%</div>
                <div class="hp-bar-bg"><div id="hp-bar-fill"></div></div>
            </div>
            <div class="boss-section">
                <div class="stat-label" style="font-size: 0.7rem; color: #666; margin-bottom: 5px;">BOSS</div>
                <div id="boss-circle">4</div>
            </div>
        </div>
        <div class="joker-row">
            <div class="joker-box" id="j-Schild" onclick="useJoker('Schild')">🛡️</div>
            <div class="joker-box" id="j-Schwert" onclick="useJoker('Schwert')">⚔️</div>
            <div class="joker-box" id="j-Trank" onclick="useJoker('Trank')">🧪</div>
        </div>
    </div>

    <div class="grid" id="game-grid"></div>

    <!-- Quiz Modal -->
    <div id="modal-quiz" class="overlay">
        <div class="modal-2">
            <div id="m-cat-ui" style="color: var(--blue); font-size: 0.8rem; letter-spacing: 3px;">KATEGORIE</div>
            <div id="j-active-indicator" style="height: 20px; font-size: 0.8rem; color: var(--gold); margin-top: 10px;"></div>
            <div id="m-q">Frage lädt...</div>
            <input type="number" id="ans-input" inputmode="numeric" placeholder="00">
            <button class="btn-confirm" onclick="checkAnswer()">SEND DATA</button>
            <div id="m-feedback" style="margin-top: 20px; font-weight: bold; font-size: 1.2rem;"></div>
            <button id="btn-next" style="display:none; background: var(--green); color: #000;" class="btn-confirm" onclick="nextRound()">CONTINUE</button>
        </div>
    </div>

    <!-- Info Modal -->
    <div id="modal-info" class="overlay">
        <div class="modal-2" style="text-align: left;">
            <h2 style="color: var(--blue); font-family: 'Orbitron';">MANUAL 2.0</h2>
            <div style="font-size: 0.9rem; color: #aaa; line-height: 1.6;">
                <p><b style="color:var(--accent)">🛡️ SHIELD:</b> Max. 10 DMG für diese Runde.</p>
                <p><b style="color:var(--green)">⚔️ BLADE:</b> Volltreffer gewährt +15 HP Heilung.</p>
                <p><b style="color:var(--gold)">🧪 SERUM:</b> Halbiert den eingehenden Schaden.</p>
            </div>
            <button class="btn-confirm" onclick="toggleModal('modal-info', false)">CLOSE</button>
        </div>
    </div>

    <!-- Setup Modal -->
    <div id="modal-setup" class="overlay">
        <div class="modal-2">
            <h2 style="color: var(--blue);">DATABASE SETUP</h2>
            <input type="file" id="excel-file" accept=".xlsx, .xls" style="font-size: 0.8rem; margin: 20px 0;">
            <button class="btn-confirm" onclick="processExcel()">INITIALIZE</button>
            <button class="btn-nav" style="width: 100%; margin-top: 10px;" onclick="toggleModal('modal-setup', false)">CANCEL</button>
        </div>
    </div>

    <footer>
        <button class="btn-nav" onclick="toggleModal('modal-info', true)">SYSTEM INFO</button>
        <button class="btn-nav" onclick="toggleModal('modal-setup', true)">CONFIG</button>
    </footer>

    <script>
        let questions = JSON.parse(localStorage.getItem('p0_v2')) || [];
        let hp = 100, counter = 0, currentIdx = null, activeJoker = null;
        let usedJokers = { Schild: false, Schwert: false, Trank: false };

        function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }

        function processExcel() {
            const file = document.getElementById('excel-file').files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                questions = json.map(r => ({ cat: r.Kategorie || "Misc", q: r.Frage, a: parseInt(r.Antwort), type: (r.Boss || "").toLowerCase(), used: false }));
                localStorage.setItem('p0_v2', JSON.stringify(questions));
                location.reload();
            };
            reader.readAsArrayBuffer(file);
        }

        function renderBoard() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = "";
            const normalQs = questions.filter(q => q.type !== 'ja' && q.type !== 'endboss');
            const cats = [...new Set(normalQs.map(q => q.cat))];

            cats.forEach(cat => {
                const open = normalQs.filter(q => q.cat === cat && !q.used);
                const card = document.createElement('div');
                card.className = `card ${open.length === 0 ? 'used' : ''}`;
                card.innerHTML = `<span class="card-cat">${cat}</span><span class="card-name">DATA BANK</span><br><small style="color:#555">${open.length} LEFT</small>`;
                if(open.length > 0) card.onclick = () => {
                    currentIdx = questions.indexOf(open[Math.floor(Math.random()*open.length)]);
                    openQuestion(questions[currentIdx]);
                };
                grid.appendChild(card);
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = hp;
            document.getElementById('hp-bar-fill').style.width = hp + "%";
            document.getElementById('boss-circle').innerText = (4 - (counter % 4));
            if(hp <= 30) document.getElementById('hp-bar-fill').style.background = "var(--accent)";
        }

        function useJoker(type) {
            if(usedJokers[type]) return;
            activeJoker = (activeJoker === type) ? null : type;
            document.querySelectorAll('.joker-box').forEach(b => b.classList.remove('active'));
            if(activeJoker) document.getElementById('j-'+type).classList.add('active');
        }

        function openQuestion(q) {
            document.getElementById('m-cat-ui').innerText = q.cat;
            document.getElementById('m-q').innerText = q.q;
            document.getElementById('j-active-indicator').innerText = activeJoker ? "⚡ ACTIVE: " + activeJoker.toUpperCase() : "";
            document.getElementById('m-feedback').innerText = "";
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('ans-input').value = "";
            toggleModal('modal-quiz', true);
        }

        function checkAnswer() {
            const q = questions[currentIdx];
            const guess = parseInt(document.getElementById('ans-input').value);
            if(isNaN(guess)) return;

            let diff = Math.abs(guess - q.a);
            if(activeJoker === 'Schild' && diff > 10) diff = 10;
            if(activeJoker === 'Trank') diff = Math.floor(diff / 2);

            if(diff === 0) {
                let gain = (activeJoker === 'Schwert') ? 15 : 5;
                hp = Math.min(100, hp + gain);
                document.getElementById('m-feedback').innerHTML = `<span style="color:var(--green)">CRITICAL HIT! +${gain}HP</span>`;
            } else {
                hp -= diff;
                document.getElementById('main').classList.add('dmg-shake');
                setTimeout(() => document.getElementById('main').classList.remove('dmg-shake'), 400);
                document.getElementById('m-feedback').innerHTML = `<span style="color:var(--accent)">- ${diff} STABILITY (VAL: ${q.a})</span>`;
            }

            if(activeJoker) {
                usedJokers[activeJoker] = true;
                document.getElementById('j-'+activeJoker).classList.add('used');
                activeJoker = null;
            }
            q.used = true; counter++;
            document.getElementById('btn-next').style.display = 'block';
            updateUI();
            localStorage.setItem('p0_v2', JSON.stringify(questions));
        }

        function nextRound() {
            toggleModal('modal-quiz', false);
            if(hp <= 0) { alert("SYSTEM CRITICAL: SHUTDOWN."); localStorage.removeItem('p0_v2'); location.reload(); }
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
